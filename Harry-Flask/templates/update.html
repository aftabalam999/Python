{% extends 'base.html' %}
{% block title %} Update Todo {% endblock title %}
{% block body %}
  
    <div class="container">
        <h1>Update Todo</h1>
      <form action="/update/{{todo.sno}}" method="POST">
        <div class="mb-3">
          <label for="title" class="form-label"
            >Title</label
          >
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            value="{{todo.title}}"
            aria-describedby="emailHelp"
          />
          <div id="emailHelp" class="form-text">
            We'll never share your email with anyone else.
          </div>
        </div>
        <div class="mb-3">
          <label for="desc" class="form-label">Description</label>
          <input
            type="text"
            class="form-control"
            id="desc"
            name="desc"
            value="{{todo.desc}}"
          />
        </div>
    
        <button type="submit" class="btn btn-dark">Submit</button>
      </form>
    </div>

{% endblock body %}
